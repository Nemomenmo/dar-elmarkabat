<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دار المركبات | Dar Elmarkabat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-content">
            <h2 class="loader-logo">دار المركبات</h2>
            <div class="loader-line"></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="#home" class="brand-logo">دار المركبات</a>
            <div class="nav-links desktop-only">
                <a href="#home" class="nav-item">الرئيسية</a>
                <a href="#directory" class="nav-item">استكشف</a>
                <a href="#hotel" class="nav-item">المرافق</a>
            </div>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="تبديل المظهر">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="mobile-menu-btn" class="icon-btn mobile-only" aria-label="القائمة">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile Fullscreen Menu -->
    <div class="mobile-menu" id="mobile-menu">
        <div class="mobile-menu-content">
            <a href="#home" class="mobile-link">الرئيسية</a>
            <a href="#directory" class="mobile-link">استكشف</a>
            <a href="#hotel" class="mobile-link">المرافق</a>
        </div>
    </div>

    <!-- Hero Section -->
    <header id="home" class="hero">
        <div class="hero-bg">
            <img src="./assets/hero/hero-bg.jpg" alt="دار المركبات" loading="lazy">
        </div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title reveal-text">مرحباً بكم<br>في دار المركبات</h1>
            <p class="hero-subtitle reveal-text delay-1">كل ما تحتاجه في مكان واحد</p>
        </div>
        <a href="#experience-intro" class="scroll-indicator" aria-label="استكشف">
            <span class="scroll-text">استكشف دار المركبات</span>
            <i class="fas fa-chevron-down scroll-arrow"></i>
        </a>
    </header>

    <!-- Cinematic Transition -->
    <section id="experience-intro" class="cinematic-transition">
        <div class="transition-content reveal-up">
            <h2 class="huge-text">أكثر من مجرد مكان</h2>
            <h3 class="gold-text">وجهة متكاملة</h3>
        </div>
    </section>

    <!-- Directory Section -->
    <section id="directory" class="directory-section section-padding">
        <div class="container">
            <div class="section-header reveal-up">
                <span class="section-label">الوجهات</span>
                <h2 class="section-title">استكشف دار المركبات</h2>
                <p class="section-desc">كل تجربة تبدأ بخطوة</p>
            </div>
            
            <!-- Cards will be injected here via script.js -->
            <div class="editorial-grid" id="directory-grid"></div>
        </div>
    </section>

    <!-- Full Facility Sections will be injected here via script.js -->
    <div id="facility-sections-container"></div>

    <!-- Global WhatsApp -->
    <a href="https://wa.me/201070322434" class="global-whatsapp" target="_blank" aria-label="تواصل مع خدمة العملاء">
        <div class="whatsapp-ring"></div>
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Advanced Lightbox / Menu Viewer -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-toolbar">
            <div class="lightbox-counter"><span id="lb-current">1</span> / <span id="lb-total">1</span></div>
            <button id="lb-close" class="icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <button id="lb-prev" class="lightbox-nav prev"><i class="fas fa-chevron-right"></i></button>
        <div class="lightbox-content">
            <img id="lb-image" src="" alt="Gallery Image">
        </div>
        <button id="lb-next" class="lightbox-nav next"><i class="fas fa-chevron-left"></i></button>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
